verified_queries:
  - name: 0;1
    question: What is the overall on-time delivery rate?
    sql: SELECT COUNT(*) AS total_delivered, SUM(CASE WHEN s.ACTUAL_ARRIVAL <= oh.REQUESTED_DELIVERY
      THEN 1 ELSE 0 END) AS on_time_count, ROUND(100.0 * SUM(CASE WHEN s.ACTUAL_ARRIVAL
      <= oh.REQUESTED_DELIVERY THEN 1 ELSE 0 END) / COUNT(*), 2) AS on_time_delivery_rate_pct
      FROM shipment AS s JOIN order_header AS oh ON s.ORDER_ID = oh.ORDER_ID WHERE
      NOT s.ACTUAL_ARRIVAL IS NULL
    verified_at: 1789592728
    verified_by: Semantic Model Generator
  - name: 1;1
    question: What is the overall fill rate?
    sql: SELECT ROUND(100.0 * SUM(ol.QUANTITY_FULFILLED) / NULLIF(SUM(ol.QUANTITY_ORDERED),
      0), 2) AS fill_rate_pct FROM order_line AS ol JOIN order_header AS oh ON ol.ORDER_ID
      = oh.ORDER_ID WHERE NOT oh.ORDER_STATUS IN ('CANCELLED', 'OPEN')
    verified_at: 1789592728
    verified_by: Semantic Model Generator
  - name: 2;1
    question: What are the days of inventory by plant and part?
    sql: SELECT p.PLANT_NAME, pt.PART_NAME, i.QUANTITY_ON_HAND, ROUND(i.QUANTITY_ON_HAND
      / NULLIF(daily_demand.AVG_DAILY_DEMAND, 0), 1) AS days_of_inventory FROM inventory
      AS i JOIN plant AS p ON i.PLANT_ID = p.PLANT_ID JOIN part AS pt ON i.PART_ID
      = pt.PART_ID LEFT JOIN (SELECT oh.PLANT_ID, ol.PART_ID, SUM(ol.QUANTITY_ORDERED)
      / NULLIF(DATEDIFF(DAY, MIN(oh.ORDER_DATE), MAX(oh.ORDER_DATE)), 0) AS AVG_DAILY_DEMAND
      FROM order_line AS ol JOIN order_header AS oh ON ol.ORDER_ID = oh.ORDER_ID WHERE
      oh.ORDER_STATUS <> 'CANCELLED' GROUP BY oh.PLANT_ID, ol.PART_ID) AS daily_demand
      ON i.PLANT_ID = daily_demand.PLANT_ID AND i.PART_ID = daily_demand.PART_ID ORDER
      BY days_of_inventory ASC
    verified_at: 1789592728
    verified_by: Semantic Model Generator
  - name: 3;1
    question: What is the landed cost per order for delivered and shipped orders?
    sql: SELECT oh.ORDER_ID, SUM(ol.LINE_TOTAL) AS product_cost, SUM(s.FREIGHT_COST)
      AS freight, SUM(s.CUSTOMS_COST) AS customs, SUM(s.INSURANCE_COST) AS insurance,
      SUM(ol.LINE_TOTAL) + SUM(s.FREIGHT_COST) + SUM(s.CUSTOMS_COST) + SUM(s.INSURANCE_COST)
      AS landed_cost FROM order_header AS oh JOIN order_line AS ol ON oh.ORDER_ID
      = ol.ORDER_ID JOIN shipment AS s ON oh.ORDER_ID = s.ORDER_ID WHERE oh.ORDER_STATUS
      IN ('DELIVERED', 'SHIPPED') GROUP BY oh.ORDER_ID ORDER BY landed_cost DESC
    verified_at: 1789592728
    verified_by: Semantic Model Generator
  - name: 4;1
    question: What is the on-time delivery rate by supplier region?
    sql: SELECT sup.REGION AS supplier_region, ROUND(100.0 * SUM(CASE WHEN s.ACTUAL_ARRIVAL
      <= oh.REQUESTED_DELIVERY THEN 1 ELSE 0 END) / COUNT(*), 2) AS on_time_delivery_rate_pct
      FROM shipment AS s JOIN order_header AS oh ON s.ORDER_ID = oh.ORDER_ID JOIN
      order_line AS ol ON oh.ORDER_ID = ol.ORDER_ID JOIN supplier_part AS sp ON ol.PART_ID
      = sp.PART_ID JOIN supplier AS sup ON sp.SUPPLIER_ID = sup.SUPPLIER_ID WHERE
      NOT s.ACTUAL_ARRIVAL IS NULL GROUP BY sup.REGION
    verified_at: 1789592728
    verified_by: Semantic Model Generator
  - name: 5;1
    question: What is the fill rate by customer segment?
    sql: SELECT c.SEGMENT AS customer_segment, ROUND(100.0 * SUM(ol.QUANTITY_FULFILLED)
      / NULLIF(SUM(ol.QUANTITY_ORDERED), 0), 2) AS fill_rate_pct FROM order_line AS
      ol JOIN order_header AS oh ON ol.ORDER_ID = oh.ORDER_ID JOIN customer AS c ON
      oh.CUSTOMER_ID = c.CUSTOMER_ID WHERE NOT oh.ORDER_STATUS IN ('CANCELLED', 'OPEN')
      GROUP BY c.SEGMENT
    verified_at: 1789592728
    verified_by: Semantic Model Generator
  - name: 6;1
    question: Which suppliers provide critical parts and what are their prices and
      lead times?
    sql: SELECT p.PART_NAME, p.CATEGORY, sup.SUPPLIER_NAME, sp.UNIT_PRICE, sup.LEAD_TIME_DAYS,
      sup.RELIABILITY_SCORE FROM supplier_part AS sp JOIN supplier AS sup ON sp.SUPPLIER_ID
      = sup.SUPPLIER_ID JOIN part AS p ON sp.PART_ID = p.PART_ID WHERE p.IS_CRITICAL
      = TRUE ORDER BY p.PART_NAME, sp.UNIT_PRICE
    verified_at: 1789592728
    verified_by: Semantic Model Generator
  - name: 7;1
    question: What is the average shipping cost and transit time by carrier and ship
      mode?
    sql: SELECT s.CARRIER, s.SHIP_MODE, COUNT(*) AS shipment_count, ROUND(AVG(s.FREIGHT_COST
      + s.CUSTOMS_COST + s.INSURANCE_COST), 2) AS avg_total_shipping_cost, ROUND(AVG(DATEDIFF(DAY,
      s.SHIP_DATE, COALESCE(s.ACTUAL_ARRIVAL, s.ESTIMATED_ARRIVAL))), 1) AS avg_transit_days
      FROM shipment AS s GROUP BY s.CARRIER, s.SHIP_MODE ORDER BY avg_total_shipping_cost
      DESC
    verified_at: 1789592728
    verified_by: Semantic Model Generator
