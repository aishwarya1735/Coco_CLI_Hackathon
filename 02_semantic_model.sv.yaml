name: SUPPLY_CHAIN_ONTOLOGY
description: 'This semantic view supports end-to-end supply chain analytics across
  procurement, manufacturing, logistics, and customer fulfillment. It models the complete
  supply chain ontology from Supplier through Part, Plant, Inventory, Order, and Shipment
  to Customer. It enables consistent reporting of four canonical metrics: On-Time
  Delivery Rate, Fill Rate, Days of Inventory, and Landed Cost. The view standardizes
  business definitions so that planning, procurement, and logistics teams get identical
  answers to the same question. It covers Q1-Q2 2025 operational data across APAC,
  EMEA, and AMERICAS regions.'
